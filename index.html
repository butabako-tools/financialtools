<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>返済額＆返済比率シミュレーター</title>
  <!-- Chart.js (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --bg: #F3F4F6;
      --card-bg: #FFFFFF;
      --text: #1F2937;
      --text-muted: #6B7280;
      --border: #E5E7EB;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans JP', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      padding: 24px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    header p {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 768px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .card {
      background: #FAFAFA;
      border: 1fr solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--primary);
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      width: 100%;
      padding: 10px 40px 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s;
      background: #FFF;
    }

    .input-wrapper input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .input-wrapper .unit {
      position: absolute;
      right: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    .result-main {
      background: #EEF2FF;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-bottom: 16px;
    }

    .result-main .label {
      font-size: 0.85rem;
      color: var(--primary);
      font-weight: 700;
    }

    .result-main .value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .result-item {
      background: #FFF;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .result-item .item-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .result-item .item-val {
      font-size: 1rem;
      font-weight: 700;
    }

    .eval-box {
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin-bottom: 16px;
      font-weight: 700;
      transition: all 0.3s;
    }

    .chart-container {
      position: relative;
      height: 180px;
      margin-top: 12px;
    }

    .stress-test {
      background: #FEF2F2;
      border: 1px solid #FCA5A5;
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
    }

    .stress-test .title {
      font-size: 0.875rem;
      font-weight: 700;
      color: #991B1B;
      margin-bottom: 8px;
    }

    .stress-test .val {
      font-size: 1.125rem;
      font-weight: 700;
      color: #DC2626;
    }

    footer {
      text-align: center;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* 5段階評価の背景色・文字色 */
    .eval-1 { background: #DC2626; color: #FFF; } /* 危険 */
    .eval-2 { background: #F97316; color: #FFF; } /* 注意 */
    .eval-3 { background: #FBBF24; color: #1F2937; } /* 適正 */
    .eval-4 { background: #10B981; color: #FFF; } /* 良好 */
    .eval-5 { background: #059669; color: #FFF; } /* 余裕 */
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>返済額＆返済比率シミュレーター</h1>
    <p>借入条件と年収を入力して毎月の返済計画を診断しよう</p>
  </header>

  <div class="grid">
    <!-- 入力フォームエリア -->
    <div class="card">
      <div class="card-title">📝 条件入力</div>
      
      <div class="input-group">
        <label for="amount">借入金額</label>
        <div class="input-wrapper">
          <input type="number" id="amount" value="3000" min="1" step="10">
          <span class="unit">万円</span>
        </div>
      </div>

      <div class="input-group">
        <label for="years">返済期間</label>
        <div class="input-wrapper">
          <input type="number" id="years" value="35" min="1" max="50">
          <span class="unit">年</span>
        </div>
      </div>

      <div class="input-group">
        <label for="rate">金利（年利）</label>
        <div class="input-wrapper">
          <input type="number" id="rate" value="0.5" step="0.01" min="0">
          <span class="unit">%</span>
        </div>
      </div>

      <div class="input-group">
        <label for="incomeGross">額面年収（支給額）</label>
        <div class="input-wrapper">
          <input type="number" id="incomeGross" value="500" min="1">
          <span class="unit">万円</span>
        </div>
      </div>

      <div class="input-group">
        <label for="incomeNet">手取り年収（推定）</label>
        <div class="input-wrapper">
          <input type="number" id="incomeNet" value="400" min="1">
          <span class="unit">万円</span>
        </div>
      </div>
    </div>

    <!-- 診断結果エリア -->
    <div class="card">
      <div class="card-title">📊 診断結果</div>

      <div class="result-main">
        <div class="label">毎月返済額（元利均等）</div>
        <div class="value" id="monthlyPay">0円</div>
      </div>

      <div class="result-grid">
        <div class="result-item">
          <div class="item-label">総返済額</div>
          <div class="item-val" id="totalPay">0万円</div>
        </div>
        <div class="result-item">
          <div class="item-label">総利息</div>
          <div class="item-val" id="totalInterest">0万円</div>
        </div>
        <div class="result-item">
          <div class="item-label">支給額ベース返済比率</div>
          <div class="item-val" id="ratioGross">0%</div>
        </div>
        <div class="result-item">
          <div class="item-label">手取りベース返済比率</div>
          <div class="item-val" id="ratioNet">0%</div>
        </div>
      </div>

      <!-- 5段階評価 -->
      <div id="evalBox" class="eval-box eval-3">
        診断中...
      </div>

      <!-- 円グラフ -->
      <div class="chart-container">
        <canvas id="ratioChart"></canvas>
      </div>

      <!-- 金利1%アップ時 -->
      <div class="stress-test">
        <div class="title">⚠️ 金利が1%上昇した場合（シミュレーション）</div>
        <div>毎月返済額：<span class="val" id="stressMonthly">0円</span>（<span id="stressDiff">+0円</span>）</div>
      </div>
    </div>
  </div>

  <footer>
    Powered by ぶたの貯金箱
  </footer>
</div>

<script>
  let chartInstance = null;

  // 元利均等返済の計算関数
  function calcMonthly(principal, annualRate, years) {
    if (annualRate === 0) return principal / (years * 12);
    const r = annualRate / 100 / 12;
    const n = years * 12;
    return (principal * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
  }

  function update() {
    // 入力値取得
    const amountMan = parseFloat(document.getElementById('amount').value) || 0;
    const years = parseFloat(document.getElementById('years').value) || 1;
    const rate = parseFloat(document.getElementById('rate').value) || 0;
    const incomeGrossMan = parseFloat(document.getElementById('incomeGross').value) || 1;
    const incomeNetMan = parseFloat(document.getElementById('incomeNet').value) || 1;

    const principal = amountMan * 10000; // 円単位

    // 1. 毎月返済額＆総額計算
    const monthly = calcMonthly(principal, rate, years);
    const total = monthly * years * 12;
    const interest = total - principal;

    // 表示更新
    document.getElementById('monthlyPay').textContent = Math.round(monthly).toLocaleString() + ' 円';
    document.getElementById('totalPay').textContent = (total / 10000).toFixed(1) + ' 万円';
    document.getElementById('totalInterest').textContent = (interest / 10000).toFixed(1) + ' 万円';

    // 2. 返済比率（年間返済額 ÷ 年収）
    const annualPay = monthly * 12;
    const ratioGrossVal = (annualPay / (incomeGrossMan * 10000)) * 100;
    const ratioNetVal = (annualPay / (incomeNetMan * 10000)) * 100;

    document.getElementById('ratioGross').textContent = ratioGrossVal.toFixed(1) + ' %';
    document.getElementById('ratioNet').textContent = ratioNetVal.toFixed(1) + ' %';

    // 3. 手取りベースでの5段階評価
    const evalBox = document.getElementById('evalBox');
    evalBox.className = 'eval-box'; // リセット

    if (ratioNetVal <= 20) {
      evalBox.classList.add('eval-5');
      evalBox.textContent = '【評価：★★★★★】 かなり余裕のある返済計画です！';
    } else if (ratioNetVal <= 25) {
      evalBox.classList.add('eval-4');
      evalBox.textContent = '【評価：★★★★☆】 理想的なバランスの返済計画です。';
    } else if (ratioNetVal <= 30) {
      evalBox.classList.add('eval-3');
      evalBox.textContent = '【評価：★★★☆☆】 適正範囲内ですが貯蓄計画も忘れずに。';
    } else if (ratioNetVal <= 35) {
      evalBox.classList.add('eval-2');
      evalBox.textContent = '【評価：★★☆☆☆】 少し圧迫感あり。家計の見直しを推奨します。';
    } else {
      evalBox.classList.add('eval-1');
      evalBox.textContent = '【評価：★☆☆☆☆】 危険水準です！破綻リスクが高いため見直しが必要です。';
    }

    // 4. 金利1%アップシミュレーション
    const stressRate = rate + 1.0;
    const stressMonthly = calcMonthly(principal, stressRate, years);
    const diffMonthly = stressMonthly - monthly;

    document.getElementById('stressMonthly').textContent = Math.round(stressMonthly).toLocaleString() + ' 円';
    document.getElementById('stressDiff').textContent = '+' + Math.round(diffMonthly).toLocaleString() + ' 円';

    // 5. 円グラフ描画（Chart.js）
    const ctx = document.getElementById('ratioChart').getContext('2d');
    const principalMan = amountMan;
    const interestMan = Math.max(0, interest / 10000);

    if (chartInstance) {
      chartInstance.destroy();
    }

    chartInstance = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['元本', '利息'],
        datasets: [{
          data: [principalMan, interestMan],
          backgroundColor: ['#4F46E5', '#F87171'],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'bottom'
          },
          tooltip: {
            callbacks: {
              label: function(context) {
                return context.label + ': ' + context.raw.toFixed(1) + '万円';
              }
            }
          }
        }
      }
    });
  }

  // イベントリスナーのセット（入力が変わるたびにリアルタイム計算）
  const inputs = document.querySelectorAll('input');
  inputs.forEach(input => {
    input.addEventListener('input', update);
  });

  // 初回実行
  update();
</script>

</body>
</html>
