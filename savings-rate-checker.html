<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今月の貯蓄率チェッカー</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}.wrap{max-width:720px;margin:auto;padding:20px 14px 40px}.card{background:#fff;border-radius:20px;padding:28px 20px;box-shadow:0 8px 30px #0001}h1{text-align:center;margin:0 0 8px;font-size:27px}.lead{text-align:center;color:#666;font-size:14px;line-height:1.7}.section{font-size:18px;font-weight:800;margin:28px 0 15px;padding-bottom:8px;border-bottom:2px solid #eee}.field{margin-bottom:16px}label{display:block;font-weight:700;margin-bottom:7px}.hint{font-size:12px;color:#777;margin:0 0 7px}.row{position:relative}input{width:100%;padding:15px 48px 15px 14px;border:1px solid #d8dce2;border-radius:12px;font-size:17px}.unit{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:#777}.total{margin-top:18px;padding:16px;border-radius:14px;background:#f3f4f6;display:flex;justify-content:space-between;font-weight:700}.total strong{font-size:22px}button{width:100%;margin-top:24px;padding:17px;border:0;border-radius:12px;background:#222;color:#fff;font-size:17px;font-weight:800}.result{display:none;margin-top:24px}.box{background:#f3f4f6;border-radius:18px;padding:24px;text-align:center}.rate{font-size:52px;font-weight:800;margin:8px 0}.message{font-weight:700;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.mini{background:#fff;border-radius:12px;padding:15px}.mini span{display:block;font-size:12px;color:#777}.mini strong{display:block;font-size:19px;margin-top:5px}.note{margin-top:16px;padding:15px;border-radius:12px;background:#fff8e8;font-size:13px;line-height:1.8}.footer{text-align:center;color:#999;font-size:12px;margin-top:20px}
</style><body><div class="wrap"><div class="card"><h1>今月の貯蓄率チェッカー</h1><p class="lead">今月の手取り収入と支出を入力するだけ。<br>今月どれくらいお金を残せたかチェックできます。</p>
<div class="section">① 今月の手取り収入</div><div class="field"><label>手取り収入</label><div class="row"><input id="income" type="number" placeholder="例：300000"><span class="unit">円</span></div></div>
<div class="section">② 今月の支出</div>
<div class="field"><label>🏠 家賃・住宅ローン</label><div class="row"><input class="expense" type="number" placeholder="例：80000" oninput="updateTotal()"><span class="unit">円</span></div></div>
<div class="field"><label>🛒 スーパー・コンビニ</label><p class="hint">食材や飲み物など</p><div class="row"><input class="expense" type="number" placeholder="例：40000" oninput="updateTotal()"><span class="unit">円</span></div></div>
<div class="field"><label>📱 通信費</label><p class="hint">スマホ・Wi-Fiなど</p><div class="row"><input class="expense" type="number" placeholder="例：8000" oninput="updateTotal()"><span class="unit">円</span></div></div>
<div class="field"><label>💡 水道光熱費</label><div class="row"><input class="expense" type="number" placeholder="例：15000" oninput="updateTotal()"><span class="unit">円</span></div></div>
<div class="field"><label>🚃 交通費</label><div class="row"><input class="expense" type="number" placeholder="例：10000" oninput="updateTotal()"><span class="unit">円</span></div></div>
<div class="field"><label>🎮 娯楽・交際費</label><p class="hint">外食・旅行・趣味・飲み会など</p><div class="row"><input class="expense" type="number" placeholder="例：30000" oninput="updateTotal()"><span class="unit">円</span></div></div>
<div class="field"><label>📦 その他</label><p class="hint">上記以外の今月の支出</p><div class="row"><input class="expense" type="number" placeholder="例：20000" oninput="updateTotal()"><span class="unit">円</span></div></div>
<div class="total"><span>今月の支出合計</span><strong id="total">0円</strong></div><button onclick="calc()">今月の貯蓄率をチェックする</button>
<div id="result" class="result"><div class="box"><div>あなたの今月の貯蓄率</div><div id="rate" class="rate">0%</div><div id="msg" class="message"></div><div class="grid"><div class="mini"><span>今月残ったお金</span><strong id="saved">0円</strong></div><div class="mini"><span>今月の支出率</span><strong id="erate">0%</strong></div></div></div><div class="note"><strong>貯蓄率の目安</strong><br>20％以上：良好 ／ 10〜20％：まずまず ／ 0〜10％：改善の余地あり ／ 0％未満：赤字</div></div>
<div class="footer">Powered by ぶたの貯金箱</div></div></div>
<script>
function exp(){return [...document.querySelectorAll('.expense')].reduce((s,x)=>s+(Number(x.value)||0),0)}
function y(n){return new Intl.NumberFormat('ja-JP').format(Math.round(n))+'円'}
function updateTotal(){document.getElementById('total').textContent=y(exp())}
function calc(){let i=Number(document.getElementById('income').value),e=exp();if(!i||i<=0){alert('今月の手取り収入を入力してください。');return}let s=i-e,r=s/i*100;document.getElementById('rate').textContent=r.toFixed(1)+'%';document.getElementById('saved').textContent=y(s);document.getElementById('erate').textContent=(e/i*100).toFixed(1)+'%';document.getElementById('msg').textContent=r>=30?'かなり優秀です。高い貯蓄率をキープできています。':r>=20?'良好です。このペースを維持できると強いです。':r>=10?'まずまずです。支出を少し見直す余地がありそうです。':r>=0?'今月はあまり残っていません。支出の中身をチェックしてみましょう。':'今月は赤字です。まずは何にお金を使ったか振り返ってみましょう。';document.getElementById('result').style.display='block'}
</script></body></html>
